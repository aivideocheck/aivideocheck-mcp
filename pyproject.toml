[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivideocheck-mcp"
version = "1.0.0"
description = "MCP server for AI Video Check: let your AI assistant check whether a video was generated by AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AI Video Check", email = "support@aivideocheck.net" }]
dependencies = [
    "mcp==2.2.0",
    "mcp-types==2.2.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://www.aivideocheck.net"
Documentation = "https://www.aivideocheck.net/en/developers"

[project.scripts]
aivideocheck-mcp = "avc_mcp:main"

[tool.setuptools]
py-modules = ["avc_mcp"]
